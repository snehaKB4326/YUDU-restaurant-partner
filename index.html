<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YUDU – Restaurant Partner Portal</title>
    <!-- Instant Auth Guard: Enforce login without any flash of unauthenticated page -->
    <script>
      (function () {
        if (localStorage.getItem('yudu_partner_logged_in') !== 'true') {
          var params = new URLSearchParams(window.location.search);
          if (!params.has('guest') && !params.has('preview')) {
            document.documentElement.style.display = 'none';
            window.location.replace('partner-login.html');
          }
        }
      })();
    </script>
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
  </head>
  <body>
    <!-- Mobile Top Navigation Bar -->
    <div class="mobile-top-bar">
      <button
        class="hamburger-btn"
        id="mobile-menu-btn"
        aria-label="Open Navigation Menu"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
        >
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="mobile-logo-wrap">
        <a href="#home">
          <img
            src="assets/logo.png"
            alt="YUDU"
            style="height: 32px; width: auto"
            onerror="
              this.style.display = 'none';
              document.getElementById('mobile-logo-fallback').style.display =
                'flex';
            "
          />
          <div
            id="mobile-logo-fallback"
            class="brand-logo-text-wrap"
            style="display: none"
          >
            <div class="brand-logo-title-row">
              <span class="brand-name-yudu">yudu</span>
            </div>
          </div>
        </a>
      </div>
      <div style="width: 38px"></div>
    </div>

    <!-- Backdrop for mobile drawer -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-layout">
      <!-- Fixed Left Sidebar -->
      <aside class="sidebar" id="sidebar">
        <!-- Circular Border Rail Collapse Toggle Button (docked on sidebar border like reference) -->
        <button
          class="sidebar-rail-toggle-btn"
          id="sidebar-collapse-btn"
          title="Collapse Sidebar (Ctrl+B)"
          aria-label="Toggle Sidebar Width"
        >
          <svg
            class="collapse-icon"
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <div class="sidebar-top">
          <!-- Branding Header -->
          <div class="sidebar-branding-row">
            <a href="#home" class="sidebar-logo-link" title="YUDU Partner">
              <!-- Full Brand Logo -->
              <div class="brand-logo-text-wrap" id="sidebar-brand-full">
                <div class="brand-logo-title-row">
                  <span class="brand-name-yudu">YUDU</span>
                </div>
                <span class="brand-tagline">Good Food. Good Mood.</span>
              </div>
              <!-- Compact Logo for Collapsed Sidebar -->
              <div class="brand-logo-compact" id="sidebar-brand-compact">
                <span class="brand-name-yudu-sm">Y</span>
              </div>
            </a>
          </div>

          <div class="sidebar-role-label">RESTAURANT PARTNER</div>

          <!-- Navigation List -->
          <nav class="sidebar-nav">
            <ul class="sidebar-nav-list">
              <li>
                <a
                  href="#home"
                  class="sidebar-nav-link active"
                  data-route="#home"
                  data-tooltip="Home"
                >
                  <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                    ></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                  </svg>
                  <span class="nav-label">Home</span>
                </a>
              </li>
              <li>
                <a
                  href="#orders"
                  class="sidebar-nav-link"
                  data-route="#orders"
                  data-tooltip="Orders"
                >
                  <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                    ></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                  </svg>
                  <span class="nav-label">Orders</span>
                </a>
              </li>
              <li>
                <a
                  href="#menu"
                  class="sidebar-nav-link"
                  data-route="#menu"
                  data-tooltip="Menu"
                >
                  <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M18 2v20M21 2v6a3 3 0 0 1-3 3M18 11v11M6 2v7a3 3 0 0 0 6 0V2M9 12v10M6 2h6"
                    ></path>
                  </svg>
                  <span class="nav-label">Menu</span>
                </a>
              </li>
              <li>
                <a
                  href="#earnings"
                  class="sidebar-nav-link"
                  data-route="#earnings"
                  data-tooltip="Earnings"
                >
                  <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect
                      x="1"
                      y="4"
                      width="22"
                      height="16"
                      rx="2"
                      ry="2"
                    ></rect>
                    <line x1="1" y1="10" x2="23" y2="10"></line>
                  </svg>
                  <span class="nav-label">Earnings</span>
                </a>
              </li>
              <li>
                <a
                  href="#restaurant"
                  class="sidebar-nav-link"
                  data-route="#restaurant"
                  data-tooltip="Restaurant"
                >
                  <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                    ></path>
                    <path d="M9 22V12h6v10"></path>
                  </svg>
                  <span class="nav-label">Restaurant</span>
                </a>
              </li>
              <li>
                <a
                  href="#settings"
                  class="sidebar-nav-link"
                  data-route="#settings"
                  data-tooltip="Settings"
                >
                  <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="4" y1="21" x2="4" y2="14"></line>
                    <line x1="4" y1="10" x2="4" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12" y2="3"></line>
                    <line x1="20" y1="21" x2="20" y2="16"></line>
                    <line x1="20" y1="12" x2="20" y2="3"></line>
                    <line x1="1" y1="14" x2="7" y2="14"></line>
                    <line x1="9" y1="8" x2="15" y2="8"></line>
                    <line x1="17" y1="16" x2="23" y2="16"></line>
                  </svg>
                  <span class="nav-label">Settings</span>
                </a>
              </li>
            </ul>
          </nav>
        </div>

        <!-- Bottom Restaurant Partner Profile -->
        <div class="sidebar-bottom">
          <div
            class="sidebar-profile-box"
            id="sidebar-profile-box"
            title="Restaurant Profile & Settings"
            data-tooltip="Profile Settings"
          >
            <div class="sidebar-avatar-circle" id="sidebar-avatar-initials">
              BF
            </div>
            <div class="sidebar-profile-info">
              <div
                class="sidebar-restaurant-title"
                id="sidebar-restaurant-name"
              >
                Biryani Factory
              </div>
              <div class="sidebar-partner-code" id="sidebar-partner-id">
                RP-2041
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Viewport -->
      <main class="main-viewport" id="main-view">
        <!-- Dynamic Page View Injected by Router -->
      </main>
    </div>

    <!-- Notification Popover Dropdown -->
    <div class="notif-popover" id="notif-popover">
      <div class="notif-header">
        <div class="notif-header-left">
          <span class="notif-title">Notifications</span>
          <span class="notif-count-pill" id="notif-header-count">0 new</span>
        </div>
        <div class="notif-header-actions">
          <button
            class="notif-action-pill-btn"
            id="notif-mark-read-btn"
            title="Mark all notifications as read"
          >
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Mark all read</span>
          </button>
          <button
            class="notif-clear-cross-btn"
            id="notif-clear-all-btn"
            title="Clear all notifications"
            aria-label="Clear all notifications"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="notif-items-list" id="notif-items-list">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- Core Scripts -->
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/restaurant.js"></script>
    <script src="js/pages/menu.js"></script>
    <script src="js/pages/earnings.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/pages/editDish.js"></script>
    <script src="js/pages/orders.js"></script>
    <script src="js/pages/orderDetails.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
